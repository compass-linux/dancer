resolver: lts-22.28

packages:
- .

ghc-options:
  "$everything": -O2

dependencies:
  - base >=4.16 && <5
  - containers >=0.6.4
  - filepath >=1.4.2
  - process >=1.6.9
  - directory >=1.3.6
  - text >=1.2.4
  - bytestring >=0.11.0
  - aeson >=2.0
  - yaml >=0.11.8
  - mtl >=2.2.2
  - transformers >=0.5.6
  - unix >=2.7.2
